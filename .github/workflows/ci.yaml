name: QuantPulse CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Lint, Analyze & Multi-Package Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Engine (3.32+)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Activate Melos
        run: dart pub global activate melos ^8.9.0

      - name: Bootstrap Multi-Package Monorepo
        run: melos bootstrap

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Architecture Boundary Check
        run: melos run check-architecture

      - name: Run Strict Static Analysis
        run: melos run analyze

      - name: Run Test Suite across Packages
        run: melos run test

  build-validation:
    name: Build APK Release Artifact
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true
      - run: dart pub global activate melos ^8.9.0
      - run: melos bootstrap
      - name: Build Android Release Bundle
        run: |
          cd apps/quant_pulse_mobile
          flutter build apk --debug