version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.32.0"

resolution: workspace

dependencies:
  core_network:
    path: ../core_network
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  sqlite3: ^3.5.2

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0